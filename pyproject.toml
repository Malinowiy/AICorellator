[project]
name = "aicorellator"
# Single-sourced from aicorellator.__version__ (see [tool.setuptools.dynamic]
# below) so the package metadata and the runtime attribute cannot drift.
dynamic = ["version"]
description = "AI Infrastructure Attack Surface Correlator"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
# Tests import `pytest` and `requests`; `requests` is already a runtime
# dependency. The framework libraries the detectors *parse* (langchain,
# mcp, flask, ...) appear only inside fixture sample projects and are not
# imported by the suite, so they are not needed to run it.
test = [
    "pytest>=7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aicorellator.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"