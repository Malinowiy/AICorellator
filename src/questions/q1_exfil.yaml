# questions/q1_exfil.yaml
id: q1_exfil
title: "Multi-hop exfiltration chains"
slice:
  include_nodes: [agent, tool, sink]
  include_edges: [provides_tool, has_access_to]
  max_nodes: 200
prompt: |
  You are analyzing an AI infrastructure graph for exfiltration risks.

  GRAPH:
  {graph_text}

  EDGE SEMANTICS:
  - agent --provides_tool--> tool   : the agent can invoke this tool
  - tool  --has_access_to--> sink   : the tool can reach this sink

  TASK:
  Find multi-hop chains of exactly this shape:
    agent --provides_tool--> tool --has_access_to--> sink

  Include only chains where:
  - the tool has "network" in its caps, AND
  - the edge to the sink has exfil=true OR risk in ["high", "critical"]

  EXCLUDE chains where the sink is local (sink:files, sink:machine)
  unless the tool also has network access AND exfil=true.

  OUTPUT FORMAT (strict JSON, no markdown, no explanation):
  {{"chains": [
    {{"chain": ["agent_id", "provides_tool", "tool_id", "has_access_to", "sink_id"],
      "reasoning": "one sentence explaining why this specific chain is risky",
      "confidence": 0.0}}
  ]}}

  EXAMPLE (for reference only, do not copy):
  {{"chains": [
    {{"chain": ["node:claude-desktop", "provides_tool", "claude-catalog:gmail", "has_access_to", "sink:network"],
      "reasoning": "Claude Desktop can invoke Gmail, which has read+write+network caps and RESTRICTED sensitivity, enabling email exfiltration to the internet.",
      "confidence": 0.85}}
  ]}}

  Now output JSON only.